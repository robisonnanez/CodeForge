Listen 8020

<VirtualHost *:80>
    ServerName codeforge.local
    Redirect permanent / https://codeforge.local/
</VirtualHost>

<VirtualHost *:8020>
    ServerName localhost
    ServerAlias 127.0.0.1
    DocumentRoot /var/www/codeforge/current/public

    <Directory /var/www/codeforge/current/public>
        AllowOverride None
        Options -Indexes +FollowSymLinks
        Require all granted
        FallbackResource /index.php
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm-codeforge.sock|fcgi://localhost"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'"

    ErrorLog ${APACHE_LOG_DIR}/codeforge-8020-error.log
    CustomLog ${APACHE_LOG_DIR}/codeforge-8020-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName codeforge.local
    DocumentRoot /var/www/codeforge/current/public

    SSLEngine on
    SSLCertificateFile /etc/codeforge/tls/codeforge.crt
    SSLCertificateKeyFile /etc/codeforge/tls/codeforge.key

    <Directory /var/www/codeforge/current/public>
        AllowOverride None
        Options -Indexes +FollowSymLinks
        Require all granted
        FallbackResource /index.php
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm-codeforge.sock|fcgi://localhost"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'"
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/codeforge-error.log
    CustomLog ${APACHE_LOG_DIR}/codeforge-access.log combined
</VirtualHost>
