[codeforge]
user = codeforge-web
group = codeforge
listen = /run/php/php8.4-fpm-codeforge.sock
listen.owner = www-data
listen.group = codeforge
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

clear_env = yes
env[APP_ENV] = production
env[HOME] = /var/lib/codeforge

php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/log/codeforge/php-fpm-error.log
php_admin_value[open_basedir] = /var/www/codeforge:/var/lib/codeforge:/srv/codeforge:/tmp
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 24M
php_admin_value[max_execution_time] = 60
